name: 🌐 Radar do Luxo — Scout & Curadoria Global de Pautas (Pré-Postagem)

on:
  # 2026-11-03: o gatilho agendado saiu daqui e virou timer systemd na VPS
  # (ops/vps/radar-scout.timer) — as mesmas duas janelas, 09h30 e 18h30 UTC
  # (06h30 e 15h30 BRT), chegando no minuto em vez de ~3h10 depois. Nunca os dois
  # ligados ao mesmo tempo: scout do Actions e scout da VPS disputariam o mesmo push
  # em main. Actions permanece como disparo manual, que é o fallback da VPS caída.
  # Permite forçar a curadoria e rastreamento a qualquer momento com 1 clique no GitHub Actions:
  workflow_dispatch:

concurrency:
  group: radar-editorial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scout-and-curate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🌐 Executar Scout Internacional e Ingestão de Pautas
        run: node scripts/curateHotFeeds.js

      - name: 💾 Persistir novas pautas na Central de Pré-Postagem
        run: |
          git config --global user.name "Radar Curator Scout"
          git config --global user.email "curator@radardoluxo.com.br"
          git add src/data/hotFeedsData.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(curation): scout global luxury feeds"
            git pull --rebase --autostash origin main
            git push
          fi
