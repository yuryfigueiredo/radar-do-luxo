name: 💎 Radar do Luxo — Publicação Editorial Autônoma

on:
  workflow_run:
    workflows: ["🌐 Radar do Luxo — Scout & Curadoria Global de Pautas (Pré-Postagem)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: radar-editorial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autonomous-editorial-cycle:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: ⚙️ Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🚀 Executar Robô Editorial Autônomo com IA & Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/autonomousCrawler.js

      - name: 💾 Publicar atualizações de acervo no GitHub e Vercel
        run: |
          git config --global user.name "Radar Editorial Bot"
          git config --global user.email "editorial@radardoluxo.com.br"
          git add src/data/mockData.js src/services/radarService.js src/data/editorialRetryQueue.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(editorial): autonomous drop publication [skip ci]"
            git push
          fi
