name: 💎 Radar do Luxo — Publicação Editorial Autônoma

on:
  schedule:
    # Ciclos Editoriais Orgânicos (Horário de Brasília: UTC-3)
    # Minutos intencionalmente alternados para cada dia da semana (Elimina qualquer aspecto robotizado):
    # - Segunda-feira : Minuto 03 (08h03, 10h03, 12h03, 14h03, 16h03, 18h03, 20h03 BRT)
    - cron: '3 11,13,15,17,19,21,23 * * 1'
    # - Terça-feira   : Minuto 19 (08h19, 10h19, 12h19, 14h19, 16h19, 18h19, 20h19 BRT)
    - cron: '19 11,13,15,17,19,21,23 * * 2'
    # - Quarta-feira  : Minuto 07 (08h07, 10h07, 12h07, 14h07, 16h07, 18h07, 20h07 BRT)
    - cron: '7 11,13,15,17,19,21,23 * * 3'
    # - Quinta-feira  : Minuto 24 (08h24, 10h24, 12h24, 14h24, 16h24, 18h24, 20h24 BRT)
    - cron: '24 11,13,15,17,19,21,23 * * 4'
    # - Sexta-feira   : Minuto 11 (08h11, 10h11, 12h11, 14h11, 16h11, 18h11, 20h11 BRT)
    - cron: '11 11,13,15,17,19,21,23 * * 5'
    # - Sábado        : Minuto 32 (08h32, 10h32, 12h32, 14h32, 16h32, 18h32, 20h32 BRT)
    - cron: '32 11,13,15,17,19,21,23 * * 6'
    # - Domingo       : Minuto 14 (08h14, 10h14, 12h14, 14h14, 16h14, 18h14, 20h14 BRT)
    - cron: '14 11,13,15,17,19,21,23 * * 0'
  # Permite acionar manualmente a qualquer momento pelo botão "Run workflow" no GitHub
  workflow_dispatch:

concurrency:
  group: radar-editorial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autonomous-editorial-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🚀 Executar Robô Editorial Autônomo com IA & Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/autonomousCrawler.js

      - name: 💾 Publicar atualizações de acervo no GitHub e Vercel
        run: |
          git config --global user.name "Radar Editorial Bot"
          git config --global user.email "editorial@radardoluxo.com.br"
          git add src/data/mockData.js src/services/radarService.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(editorial): autonomous drop publication [skip ci]"
            git push
          fi
