<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const saved = localStorage.getItem("color-scheme");
        if (saved === "dark") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="color-scheme"]').content = "dark";
        } else {
          document.documentElement.classList.remove("dark");
          document.querySelector('meta[name="color-scheme"]').content = "light";
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Radar do Luxo — Digital Magazine &amp; Trend Radar</title>
    <meta name="description" content="Radar do Luxo: revista digital de luxo, alta relojoaria, joalheria, gastronomia, lifestyle e tendências exclusivas." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.radardoluxo.com.br/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Radar do Luxo" />
    <meta property="og:title" content="Radar do Luxo — Digital Magazine &amp; Trend Radar" />
    <meta property="og:description" content="Revista digital de luxo, alta relojoaria, joalheria, gastronomia, lifestyle e tendências exclusivas." />
    <meta property="og:url" content="https://www.radardoluxo.com.br/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Radar do Luxo — Digital Magazine &amp; Trend Radar" />
    <meta name="twitter:description" content="Revista digital de luxo, alta relojoaria, joalheria, gastronomia, lifestyle e tendências exclusivas." />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Radar do Luxo",
        "url": "https://www.radardoluxo.com.br/",
        "inLanguage": "pt-BR"
      }
    </script>
  </head>
  <body class="bg-lux-bg-light dark:bg-lux-bg-dark text-lux-text-primary dark:text-lux-text-darkPrimary transition-colors duration-300 antialiased font-sans selection:bg-lux-gold selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
